    /* Selected day orange */
    .flatpickr-day.selected,

    /* Month/Arrows orange */

    .flatpickr-current-month,
    .flatpickr-monthDropdown-months,
    .flatpickr-weekday {
      color: #fff !important;
    }

    .flatpickr-prev-month svg,
    .flatpickr-next-month svg {

    }

    /* Calendar background darker (optional) */

  </style>

        <div class="col-lg-6 wow fadeInUp" data-wow-delay="0.5s">

            <div class="row g-3">
              <div class="col-md-6">

              </div>

              <!-- Date (Flatpickr) -->

                <div class="form-floating">
                  <input type="text" class="form-control bg-secondary border-0" id="dateText" placeholder="DD-MM-YYYY"

              <div class="col-12">

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function () {
      emailjs.init("IEtlfI87lRwr7F2MA"); // PUBLIC KEY
    })();
  </script>

  <!-- Flatpickr -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <script>
    // Flatpickr init (Dark + DD-MM-YYYY)
    flatpickr("#dateText", {
      dateFormat: "d-m-Y",
      disableMobile: true,
      allowInput: false
    });

    function sendMediaEmail(e) {
      e.preventDefault();

      const btn = document.getElementById("sendBtn");
      const originalText = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = "Sending...";

      const payload = {
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("email").value.trim(),
        date: document.getElementById("dateText").value.trim(), // already DD-MM-YYYY
        subject: document.getElementById("subject").value.trim(),
        message: document.getElementById("message").value.trim(),
      };

      emailjs.send("service_nycydhm", "template_aha3ca6", payload)
        .then(() => {
          btn.innerHTML = "✔ Message Sent";
          document.getElementById("mediaContactForm").reset();

          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }, 3000);
        })
        .catch((error) => {
          btn.innerHTML = "❌ Failed";
          console.error(error);

          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }, 3000);
        });
    }
  </script>
